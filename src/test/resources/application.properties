# 테스트는 개발자 로컬 .env에 영향을 받지 않아야 한다.
#
# 메인 application.yml이 `spring.config.import: optional:file:.env[.properties]`로
# 프로젝트 루트의 .env를 읽는데, 이 파일은 테스트 JVM에서도 그대로 적용된다.
# 로컬 E2E용 .env가 H2 파일 DB나 MySQL을 가리키면 테스트 컨텍스트가 그 DB에 붙으려다
# dialect를 결정하지 못하고 깨진다. 그래서 데이터소스만 테스트용 인메모리로 되돌린다.
spring.datasource.url=jdbc:h2:mem:mirigangneung-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
