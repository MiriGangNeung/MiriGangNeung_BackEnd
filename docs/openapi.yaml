openapi: 3.0.3
info:
  title: MiriGangNeung Backend API
  version: 0.0.1
  description: |
    미리강릉 백엔드의 현재 P0 API 계약이다.
    인증 기능은 아직 없으며, 모든 API는 /api/v1 아래에 있다.
servers:
  - url: http://localhost:8080
    description: Local/Docker
tags:
  - name: Places
  - name: Compositions
  - name: Courses
  - name: Routes
paths:
  /api/v1/places:
    get:
      tags: [Places]
      summary: 관광지 목록 조회 및 키워드 검색
      parameters:
        - {name: category, in: query, required: false, schema: {type: string}}
        - {name: keyword, in: query, required: false, schema: {type: string, default: ''}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 목록 조회 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlacePageResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
  /api/v1/places/{placeId}:
    get:
      tags: [Places]
      summary: 관광지 상세 조회
      parameters:
        - {$ref: '#/components/parameters/PlaceId'}
      responses:
        '200':
          description: 상세 조회 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaceDetailResponse'}
        '404': {$ref: '#/components/responses/PlaceNotFound'}
  /api/v1/places/{placeId}/nearby:
    get:
      tags: [Places]
      summary: 주변 관광지 조회
      parameters:
        - {$ref: '#/components/parameters/PlaceId'}
      responses:
        '200':
          description: 주변 관광지 목록
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PlaceResponse'}}
  /api/v1/places/{placeId}/related:
    get:
      tags: [Places]
      summary: 연관 관광지 조회
      parameters:
        - {$ref: '#/components/parameters/PlaceId'}
      responses:
        '200':
          description: 연관 관광지 목록
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PlaceResponse'}}
  /api/v1/compositions:
    post:
      tags: [Compositions]
      summary: 사진 합성 Job 생성
      description: 실제 AI Provider가 연결되지 않은 현재 구현에서는 완료 이미지가 생성되지 않을 수 있다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo, onePickId]
              properties:
                photo: {type: string, format: binary}
                onePickId: {type: string}
                aspectRatio: {type: string, example: '4:3'}
      responses:
        '200':
          description: Job 생성 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompositionStatusResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
  /api/v1/compositions/{jobId}:
    get:
      tags: [Compositions]
      summary: 사진 합성 Job 상태 조회
      parameters:
        - {$ref: '#/components/parameters/JobId'}
      responses:
        '200':
          description: Job 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompositionStatusResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/compositions/{jobId}/retry:
    post:
      tags: [Compositions]
      summary: 사진 합성 Job 재시도
      parameters:
        - {$ref: '#/components/parameters/JobId'}
      responses:
        '200':
          description: 재시도 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompositionStatusResponse'}
  /api/v1/compositions/{jobId}/download:
    get:
      tags: [Compositions]
      summary: 합성 결과 다운로드
      parameters:
        - {$ref: '#/components/parameters/JobId'}
      responses:
        '200': {description: 파일 다운로드, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
  /api/v1/courses:
    post:
      tags: [Courses]
      summary: 규칙 기반 코스 생성
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCourseRequest'}
            example:
              placeIds: ['백엔드에서 받은 place id']
              onePickId: '백엔드에서 받은 place id'
              types: [nature]
              companion: couple
              duration: day
      responses:
        '200':
          description: 코스 생성 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
  /api/v1/courses/{courseId}:
    get:
      tags: [Courses]
      summary: 코스 조회
      parameters:
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200': {description: 코스 응답, content: {application/json: {schema: {$ref: '#/components/schemas/CourseResponse'}}}}
    delete:
      tags: [Courses]
      summary: 코스 삭제
      parameters:
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200': {description: 삭제 성공}
  /api/v1/courses/{courseId}/share:
    post:
      tags: [Courses]
      summary: 익명 공유 링크 생성
      parameters:
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200': {description: 공유 정보, content: {application/json: {schema: {$ref: '#/components/schemas/ShareResponse'}}}}
    delete:
      tags: [Courses]
      summary: 공유 링크 폐기
      parameters:
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200': {description: 폐기 성공}
  /api/v1/share/courses/{token}:
    get:
      tags: [Courses]
      summary: 공유 토큰으로 코스 조회
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 공유 코스, content: {application/json: {schema: {$ref: '#/components/schemas/CourseResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/routes/walking:
    post:
      tags: [Routes]
      summary: 두 지점 사이 도보 경로 조회
      description: 현재 백엔드 계약은 origin과 destination 두 지점이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WalkingRouteRequest'}
      responses:
        '200': {description: 정규화된 경로, content: {application/json: {schema: {$ref: '#/components/schemas/WalkingRouteResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '502': {$ref: '#/components/responses/ExternalApiError'}
components:
  parameters:
    PlaceId: {name: placeId, in: path, required: true, schema: {type: string}}
    JobId: {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    CourseId: {name: courseId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    InvalidRequest:
      description: 요청값이 올바르지 않음
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    NotFound:
      description: 대상을 찾을 수 없음
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    PlaceNotFound:
      description: 관광지를 찾을 수 없음
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ExternalApiError:
      description: 외부 API 오류
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  schemas:
    PlaceResponse:
      type: object
      required: [id, name, region, category, tags, latitude, longitude]
      properties:
        id: {type: string}
        name: {type: string}
        region: {type: string}
        category: {type: string}
        tags: {type: array, items: {type: string}}
        thumbnailUrl: {type: string, nullable: true}
        latitude: {type: number, format: double, nullable: true}
        longitude: {type: number, format: double, nullable: true}
    PlacePageResponse:
      type: object
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/PlaceResponse'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    PlaceDetailResponse:
      allOf:
        - {$ref: '#/components/schemas/PlaceResponse'}
        - type: object
          properties:
            description: {type: string, nullable: true}
            imageUrls: {type: array, items: {type: string}}
    CreateCourseRequest:
      type: object
      required: [placeIds, onePickId, types, companion, duration]
      properties:
        placeIds: {type: array, minItems: 1, maxItems: 20, items: {type: string}}
        onePickId: {type: string}
        types: {type: array, minItems: 1, maxItems: 2, items: {type: string}}
        companion: {type: string}
        duration: {type: string}
        startDate: {type: string, format: date, nullable: true}
        endDate: {type: string, format: date, nullable: true}
    CourseResponse:
      type: object
      properties:
        courseId: {type: string, format: uuid}
        title: {type: string}
        duration: {type: string}
        stops: {type: array, items: {$ref: '#/components/schemas/CourseStop'}}
        totalDistanceMeters: {type: integer}
        totalTravelMinutes: {type: integer}
    CourseStop:
      type: object
      properties:
        sequence: {type: integer}
        placeId: {type: string}
        name: {type: string}
        thumbnailUrl: {type: string, nullable: true}
        arrivalTime: {type: string}
        stayMinutes: {type: integer}
        crowdLevel: {type: string}
        isOnePick: {type: boolean}
        note: {type: string}
        latitude: {type: number, format: double, nullable: true}
        longitude: {type: number, format: double, nullable: true}
    ShareResponse:
      type: object
      properties:
        shareToken: {type: string}
        shareUrl: {type: string}
        expiresAt: {type: string, format: date-time}
    CompositionStatusResponse:
      type: object
      properties:
        jobId: {type: string, format: uuid}
        status: {type: string, enum: [QUEUED, RUNNING, DONE, FAILED, EXPIRED]}
        progress: {type: integer}
        stage: {type: string, nullable: true}
        resultAvailable: {type: boolean}
        downloadUrl: {type: string, nullable: true}
        place: {type: object, nullable: true}
        error: {type: string, nullable: true}
    WalkingRouteRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: {$ref: '#/components/schemas/Coordinate'}
        destination: {$ref: '#/components/schemas/Coordinate'}
    Coordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
    WalkingRouteResponse:
      type: object
      properties:
        distanceMeters: {type: integer}
        durationSeconds: {type: integer}
        polyline: {type: array, items: {type: array, minItems: 2, maxItems: 2, items: {type: number}}}
    ErrorResponse:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer}
        code: {type: string}
        message: {type: string}
        path: {type: string}
