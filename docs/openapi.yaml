openapi: 3.0.3
info:
  title: MiriGangNeung Backend API
  version: 0.0.1
  description: |
    미리강릉 백엔드의 현재 P0 API 계약이다.
    인증 기능은 아직 없으며, 모든 API는 /api/v1 아래에 있다.
servers:
  - url: http://localhost:8080
    description: Local/Docker
tags:
  - name: Places
  - name: Images
  - name: Compositions
  - name: Courses
  - name: Routes
paths:
  /api/v1/places:
    get:
      tags: [Places]
      summary: 관광지 목록 조회 및 키워드 검색
      parameters:
        - {name: category, in: query, required: false, schema: {type: string}}
        - {name: keyword, in: query, required: false, schema: {type: string, default: ''}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 목록 조회 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlacePageResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
  /api/v1/places/{placeId}:
    get:
      tags: [Places]
      summary: 관광지 상세 조회
      parameters:
        - {$ref: '#/components/parameters/PlaceId'}
      responses:
        '200':
          description: 상세 조회 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaceDetailResponse'}
        '404': {$ref: '#/components/responses/PlaceNotFound'}
  /api/v1/places/{placeId}/nearby:
    get:
      tags: [Places]
      summary: 주변 관광지 조회
      parameters:
        - {$ref: '#/components/parameters/PlaceId'}
      responses:
        '200':
          description: 주변 관광지 목록
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PlaceResponse'}}
  /api/v1/places/{placeId}/related:
    get:
      tags: [Places]
      summary: 연관 관광지 조회
      parameters:
        - {$ref: '#/components/parameters/PlaceId'}
      responses:
        '200':
          description: 연관 관광지 목록
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PlaceResponse'}}
  /media/images/{storageKey}:
    get:
      tags: [Images]
      summary: 저장된 장소 이미지 스트리밍
      description: CDN으로 교체 가능한 이미지 origin endpoint다. 성공 응답은 장기 immutable Cache-Control을 제공한다.
      parameters:
        - name: storageKey
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 이미지 파일
          headers:
            Cache-Control:
              schema: {type: string, example: 'public, max-age=31536000, immutable'}
          content:
            image/*:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/compositions:
    post:
      tags: [Compositions]
      summary: 사진 합성 Job 생성
      description: Place.id UUID와 Type1 관광지 원본을 사용해 Agent generation Job을 생성한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo, onePickId]
              properties:
                photo: {type: string, format: binary}
                onePickId: {type: string, format: uuid}
                aspectRatio: {type: string, enum: ['1:1', '4:5', '9:16'], default: '4:5'}
                backgroundImageUrl:
                  type: string
                  nullable: true
                  description: 해당 Place에서 사용자가 선택한 Type1 원본 이미지 URL. 생략 시 첫 Type1 이미지 사용.
      responses:
        '200':
          description: Job 생성 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompositionStatusResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {description: 지원하지 않는 이미지 형식}
        '422': {description: 합성 가능한 Type1 배경 없음}
        '502': {description: 배경 원본 또는 Agent 호출 실패}
        '503': {description: AI_BASE_URL 미설정}
  /api/v1/compositions/{jobId}:
    get:
      tags: [Compositions]
      summary: 사진 합성 Job 상태 조회
      parameters:
        - {$ref: '#/components/parameters/JobId'}
      responses:
        '200':
          description: Job 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompositionStatusResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/compositions/{jobId}/retry:
    post:
      tags: [Compositions]
      summary: 사진 합성 Job 재시도
      parameters:
        - {$ref: '#/components/parameters/JobId'}
      responses:
        '200':
          description: 재시도 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompositionStatusResponse'}
        '409': {description: 재시도 불가능한 상태 또는 오류}
        '410': {description: 사용자 원본 이미지 TTL 만료}
  /api/v1/compositions/{jobId}/download:
    get:
      tags: [Compositions]
      summary: 합성 결과 다운로드
      parameters:
        - {$ref: '#/components/parameters/JobId'}
      responses:
        '200': {description: 합성 이미지 다운로드, content: {image/*: {schema: {type: string, format: binary}}}}
        '409': {description: 결과가 아직 준비되지 않음}
        '410': {description: 결과 TTL 만료}
  /api/v1/courses:
    post:
      tags: [Courses]
      summary: 규칙 기반 코스 생성
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCourseRequest'}
            example:
              placeIds: ['백엔드에서 받은 place id']
              onePickId: '백엔드에서 받은 place id'
              types: [nature]
              companion: couple
              duration: day
      responses:
        '200':
          description: 코스 생성 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
  /api/v1/courses/{courseId}:
    get:
      tags: [Courses]
      summary: 코스 조회
      parameters:
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200': {description: 코스 응답, content: {application/json: {schema: {$ref: '#/components/schemas/CourseResponse'}}}}
    delete:
      tags: [Courses]
      summary: 코스 삭제
      parameters:
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200': {description: 삭제 성공}
  /api/v1/courses/{courseId}/nearby-places:
    get:
      tags: [Courses]
      summary: 선택한 관광지 주변 카페·음식점 조회
      description: 모든 관광지 정거장 주변 2km를 Kakao Local로 조회하고 외부 장소 ID로 중복 제거한다.
      parameters:
        - {$ref: '#/components/parameters/CourseId'}
        - name: category
          in: query
          required: true
          schema: {type: string, enum: [restaurant, cafe]}
      responses:
        '200':
          description: 거리순 주변 장소 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NearbyPlacesResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '502': {$ref: '#/components/responses/ExternalApiError'}
  /api/v1/courses/{courseId}/stops/external:
    post:
      tags: [Courses]
      summary: Kakao 주변 장소를 코스 snapshot으로 추가
      parameters:
        - {$ref: '#/components/parameters/CourseId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddExternalStopRequest'}
      responses:
        '200':
          description: 장소가 추가된 코스
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '409': {description: 이미 코스에 있는 장소}
  /api/v1/courses/{courseId}/stops/{stopId}:
    delete:
      tags: [Courses]
      summary: 코스 장소 삭제
      parameters:
        - {$ref: '#/components/parameters/CourseId'}
        - name: stopId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 장소가 삭제된 코스
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/courses/{courseId}/stops/order:
    put:
      tags: [Courses]
      summary: 코스 장소 순서 변경
      parameters:
        - {$ref: '#/components/parameters/CourseId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StopOrderRequest'}
      responses:
        '200':
          description: 순서가 변경된 코스
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
  /api/v1/courses/{courseId}/share:
    post:
      tags: [Courses]
      summary: 익명 공유 링크 생성
      parameters:
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200': {description: 공유 정보, content: {application/json: {schema: {$ref: '#/components/schemas/ShareResponse'}}}}
    delete:
      tags: [Courses]
      summary: 공유 링크 폐기
      parameters:
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200': {description: 폐기 성공}
  /api/v1/share/courses/{token}:
    get:
      tags: [Courses]
      summary: 공유 토큰으로 코스 조회
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 공유 코스, content: {application/json: {schema: {$ref: '#/components/schemas/CourseResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/routes/walking:
    post:
      tags: [Routes]
      summary: 두 지점 사이 도보 경로 조회
      description: 현재 백엔드 계약은 origin과 destination 두 지점이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WalkingRouteRequest'}
      responses:
        '200': {description: 정규화된 경로, content: {application/json: {schema: {$ref: '#/components/schemas/WalkingRouteResponse'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '502': {$ref: '#/components/responses/ExternalApiError'}
components:
  parameters:
    PlaceId: {name: placeId, in: path, required: true, schema: {type: string}}
    JobId: {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    CourseId: {name: courseId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    InvalidRequest:
      description: 요청값이 올바르지 않음
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    NotFound:
      description: 대상을 찾을 수 없음
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    PlaceNotFound:
      description: 관광지를 찾을 수 없음
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ExternalApiError:
      description: 외부 API 오류
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  schemas:
    PlaceResponse:
      type: object
      required: [id, name, region, category, tags, latitude, longitude, imageUrls, originalImageUrls]
      properties:
        id: {type: string}
        name: {type: string}
        region: {type: string}
        category: {type: string}
        tags: {type: array, items: {type: string}}
        thumbnailUrl: {type: string, nullable: true, description: 카드 대표 썸네일 URL}
        latitude: {type: number, format: double, nullable: true}
        longitude: {type: number, format: double, nullable: true}
        imageUrls:
          type: array
          maxItems: 5
          items: {type: string}
          description: 카드 표시용 썸네일 URL 목록. originalImageUrls와 같은 순서다.
        originalImageUrls:
          type: array
          maxItems: 5
          items: {type: string}
          description: 합성·대형 표시용 원본 URL 목록. imageUrls와 같은 인덱스를 사용한다.
    PlacePageResponse:
      type: object
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/PlaceResponse'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    PlaceDetailResponse:
      allOf:
        - {$ref: '#/components/schemas/PlaceResponse'}
        - type: object
          properties:
            description: {type: string, nullable: true}
            imageUrls: {type: array, items: {type: string}}
            originalImageUrls: {type: array, items: {type: string}}
            images: {type: array, items: {$ref: '#/components/schemas/PlaceImageResponse'}}
    PlaceImageResponse:
      type: object
      properties:
        imageUrl: {type: string, description: 카드 표시용 썸네일 URL}
        originalImageUrl: {type: string, description: 합성·대형 표시용 원본 URL}
        sourceImageUrl: {type: string, description: 한국관광공사 원본 URL, attribution/debug 용도}
        title: {type: string, nullable: true}
        source: {type: string, nullable: true}
        sortOrder: {type: integer, nullable: true}
        copyrightCode: {type: string, nullable: true, example: Type1}
    CreateCourseRequest:
      type: object
      required: [placeIds, onePickId, types, companion, duration]
      properties:
        placeIds: {type: array, minItems: 1, maxItems: 20, items: {type: string}}
        onePickId: {type: string}
        types: {type: array, minItems: 1, maxItems: 2, items: {type: string}}
        companion: {type: string}
        duration: {type: string}
        startDate: {type: string, format: date, nullable: true}
        endDate: {type: string, format: date, nullable: true}
    CourseResponse:
      type: object
      properties:
        courseId: {type: string, format: uuid}
        title: {type: string}
        duration: {type: string}
        stops: {type: array, items: {$ref: '#/components/schemas/CourseStop'}}
        totalDistanceMeters: {type: integer}
        totalTravelMinutes: {type: integer}
        routeStatus: {type: string, enum: [READY, UNAVAILABLE]}
        routeSegments: {type: array, items: {$ref: '#/components/schemas/RouteSegment'}}
    CourseStop:
      type: object
      properties:
        stopId: {type: string, format: uuid, nullable: true}
        sequence: {type: integer}
        placeId: {type: string, nullable: true}
        externalPlaceId: {type: string, nullable: true}
        name: {type: string}
        thumbnailUrl: {type: string, nullable: true}
        arrivalTime: {type: string}
        stayMinutes: {type: integer}
        crowdLevel: {type: string}
        isOnePick: {type: boolean}
        note: {type: string}
        latitude: {type: number, format: double, nullable: true}
        longitude: {type: number, format: double, nullable: true}
        external: {type: boolean}
        category: {type: string, nullable: true}
        categoryName: {type: string, nullable: true}
        address: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        placeUrl: {type: string, nullable: true}
    RouteSegment:
      type: object
      properties:
        fromStopId: {type: string, format: uuid, nullable: true}
        toStopId: {type: string, format: uuid, nullable: true}
        distanceMeters: {type: integer}
        durationSeconds: {type: integer}
        polyline: {type: array, items: {type: array, minItems: 2, maxItems: 2, items: {type: number}}}
    NearbyPlacesResponse:
      type: object
      properties:
        category: {type: string, enum: [restaurant, cafe]}
        places: {type: array, items: {$ref: '#/components/schemas/NearbyPlace'}}
    NearbyPlace:
      type: object
      properties:
        externalPlaceId: {type: string}
        name: {type: string}
        category: {type: string, enum: [restaurant, cafe]}
        categoryName: {type: string, nullable: true}
        address: {type: string, nullable: true}
        roadAddress: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        placeUrl: {type: string, nullable: true}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        distanceMeters: {type: integer}
        nearestStopId: {type: string, format: uuid, nullable: true}
        nearestStopName: {type: string, nullable: true}
    AddExternalStopRequest:
      type: object
      required: [externalPlaceId, name, category, longitude, latitude]
      properties:
        externalPlaceId: {type: string}
        name: {type: string}
        category: {type: string, enum: [restaurant, cafe]}
        categoryName: {type: string, nullable: true}
        address: {type: string, nullable: true}
        roadAddress: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        placeUrl: {type: string, nullable: true}
        longitude: {type: number, format: double, minimum: 124, maximum: 132}
        latitude: {type: number, format: double, minimum: 33, maximum: 39}
    StopOrderRequest:
      type: object
      required: [stopIds]
      properties:
        stopIds: {type: array, minItems: 1, items: {type: string, format: uuid}}
    ShareResponse:
      type: object
      properties:
        shareToken: {type: string}
        shareUrl: {type: string}
        expiresAt: {type: string, format: date-time}
    CompositionStatusResponse:
      type: object
      required: [jobId, status, progress, stage, resultAvailable]
      properties:
        jobId: {type: string, format: uuid}
        status: {type: string, enum: [QUEUED, ANALYZING, COMPOSITING, QUALITY_CHECK, DONE, FAILED]}
        progress: {type: integer}
        stage: {type: string, nullable: true}
        resultAvailable: {type: boolean}
        downloadUrl: {type: string, nullable: true}
        place: {type: object, nullable: true}
        error:
          allOf:
            - {$ref: '#/components/schemas/CompositionError'}
          nullable: true
        safety:
          allOf:
            - {$ref: '#/components/schemas/CompositionSafety'}
          nullable: true
    CompositionError:
      type: object
      required: [code, message, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
    CompositionSafety:
      type: object
      properties:
        status: {type: string, nullable: true, enum: [PASSED, REJECTED, UNKNOWN]}
        reasonCode: {type: string, nullable: true}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/CompositionWarning'}
    CompositionWarning:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    WalkingRouteRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: {$ref: '#/components/schemas/Coordinate'}
        destination: {$ref: '#/components/schemas/Coordinate'}
    Coordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
    WalkingRouteResponse:
      type: object
      properties:
        distanceMeters: {type: integer}
        durationSeconds: {type: integer}
        polyline: {type: array, items: {type: array, minItems: 2, maxItems: 2, items: {type: number}}}
    ErrorResponse:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer}
        code: {type: string}
        message: {type: string}
        path: {type: string}
